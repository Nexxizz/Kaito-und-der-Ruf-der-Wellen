<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="32" cy="32" r="29.5"/>
    </clipPath>
    <radialGradient id="bg" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#184275"/>
      <stop offset="65%" stop-color="#0a1a38"/>
      <stop offset="100%" stop-color="#030a18"/>
    </radialGradient>
    <linearGradient id="whale" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5caeff"/>
      <stop offset="50%" stop-color="#3273ba"/>
      <stop offset="100%" stop-color="#1d4880"/>
    </linearGradient>
    <linearGradient id="belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6ecff"/>
      <stop offset="100%" stop-color="#8bc3f8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22b8cf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4c6ef5" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Alles sauber innerhalb des Kreises geclippt -->
  <g clip-path="url(#circle-clip)">
    <!-- Meeres- und Nachthimmel-Hintergrund -->
    <rect width="64" height="64" fill="url(#bg)"/>

    <!-- Sterne / Lichtfunken -->
    <circle cx="48" cy="14" r="1.6" fill="#ffe082"/>
    <circle cx="16" cy="18" r="1.2" fill="#e0f7fa" opacity="0.8"/>
    <circle cx="38" cy="9" r="0.9" fill="#ffffff" opacity="0.9"/>
    <!-- Sternenglanz-Kreuz -->
    <path d="M48 9.5 L48 18.5 M43.5 14 L52.5 14" stroke="#ffe082" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/>

    <!-- Gischt-Tröpfchen der Fontäne -->
    <circle cx="28" cy="12.5" r="1.3" fill="#ffffff" opacity="0.95"/>
    <circle cx="24.5" cy="15.5" r="1.0" fill="#b2ebf2" opacity="0.85"/>
    <circle cx="31.5" cy="16.5" r="0.9" fill="#e0f7fa" opacity="0.9"/>

    <!-- Hintere Flosse -->
    <path d="M 27 29 C 25 33 22 36 19 36 C 22 34 25 31 27 29 Z" fill="#1b4578"/>

    <!-- Wal-Körper (Kaito springt) -->
    <path d="M 12 36 
             C 16 31, 23 23, 33 22 
             C 41 21, 47 24, 49 28 
             C 50 31, 47 34, 42 35 
             C 34 36, 25 37, 18 39 
             Z" fill="url(#whale)"/>

    <!-- Heller Bauch -->
    <path d="M 28 32 
             C 34 31, 41 31, 46 30
             C 44 33, 40 35, 34 35
             C 29 35, 25 34, 28 32 Z" fill="url(#belly)"/>

    <!-- Auge -->
    <circle cx="43" cy="27" r="1.4" fill="#081426"/>
    <circle cx="43.5" cy="26.6" r="0.5" fill="#ffffff"/>

    <!-- Flipper nah -->
    <path d="M 33 33 C 32 38 29 44 26 45 C 28 41 31 36 34 33 Z" fill="#64b5f6" stroke="#c8e4ff" stroke-width="0.5"/>

    <!-- Schwanzflosse -->
    <path d="M 13 36 
             C 10 32, 7 30, 6 29 
             C 8 32, 9 34, 11 36 
             C 9 37, 7 39, 6 42 
             C 8 41, 11 39, 13 37 Z" fill="#3273ba"/>

    <!-- Welle unten -->
    <path d="M -2 41 
             C 10 37, 22 44, 33 40 
             C 42 37, 52 42, 66 39 
             L 66 66 L -2 66 Z" fill="url(#wave)"/>
    <path d="M -2 41 C 10 37, 22 44, 33 40 C 42 37, 52 42, 66 39" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Äußerer leuchtender Ring -->
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#4be3e8" stroke-width="2.2" stroke-opacity="0.85"/>
</svg>
